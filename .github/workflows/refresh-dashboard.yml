name: Refresh data and dashboard

on:
  schedule:
    # Mondays at 07:17 UTC (07:17 GMT / 08:17 BST).
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'ShabibLiaqat/Uk-job-market-analytics'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-automation.txt
      - name: Install dependencies and browser
        run: |
          python -m pip install -r requirements-automation.txt
          python -m playwright install --with-deps chromium
      - name: Check refresh failure safeguards
        run: python -m unittest discover -s tests
      - name: Collect and validate fresh API data
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python -m src.collect_adzuna --pages 2 --days 30
          python -m src.validate_extract
      - name: Rebuild warehouse
        run: python -m src.build_warehouse
      - name: Render and verify dashboard screenshot
        run: python -m src.capture_dashboard --require-date "$(date -u +%F)"
      - name: Save warehouse and screenshot as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: careers-observatory-${{ github.run_id }}
          retention-days: 14
          path: |
            data/careers_observatory.sqlite
            Screenshot/dashboard.png
      - name: Publish successful refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/jobs.csv data/snapshots/jobs_*.csv Screenshot/dashboard.png
          if git diff --cached --quiet; then
            echo "No published files changed."
          else
            git commit -m "Update job sample and dashboard preview"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - name: Run summary
        run: |
          echo "Fresh API extract validated; SQLite rebuilt; Streamlit screenshot verified and published." >> "$GITHUB_STEP_SUMMARY"
